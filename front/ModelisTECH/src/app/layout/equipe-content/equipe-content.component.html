<div class="relative z-20 bg-gradient-to-r from-[#dfe2fe] via-[#b1cbfa] to-[#8e98f5] pb-20">
  <div>
    <h1 class="text-center text-6xl font-black font-poppins uppercase text-gray-800 mb-2">NOTRE ÉQUIPE</h1>
  </div>
  <div class="container mx-auto px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 mt-20 lg:grid-cols-3 gap-8">
      <!-- Itération sur les membres -->

      <div *ngFor="let membre of membres" class="flex rounded-xl mt-4 items-center border border-gray-100 py-8 px-8 hover:shadow-lg transition-shadow duration-300">
        <img
          [src]="imgBack + membre.image"
          [alt]="membre.prenom + ' ' + membre.nom"
          class="w-20 h-20 rounded-full mr-2 object-cover mb-4"
        >
        <div class="text-center">
          <h3 class="text-xl font-semibold text-gray-900">
            {{membre.prenom}} {{membre.nom}}
          </h3>
          <p class="text-gray-600">{{membre.siteId.nom}}</p>
          <p class="text-sm text-gray-500">{{membre.email}}</p>
        </div>
      </div>

    </div>
  </div>
</div>
