<section class="w-full relative">
  <video #video autoplay loop muted playsinline class="video w-full h-screen object-cover">
    <source [src]="videoCover" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div class="absolute bottom-14 right-12 w-40 h-40">
    <!-- Globe SVG -->
    <svg class="globe" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="1"/>
      <!-- Latitude lines -->
      <path d="M10,50 h80" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <path d="M20,30 h60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <path d="M20,70 h60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <!-- Longitude lines -->
      <path d="M50,10 v80" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <path d="M30,20 v60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <path d="M70,20 v60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <!-- Curved longitude lines -->
      <path d="M25,25 q25,50 25,50" stroke="white" stroke-width="0.5" opacity="0.3" fill="none"/>
      <path d="M75,25 q-25,50 -25,50" stroke="white" stroke-width="0.5" opacity="0.3" fill="none"/>
    </svg>
    <svg viewBox="0 0 200 200" class="rotate-text">

      <defs>
        <path id="circlePath" d="M100,100 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0" />
      </defs>


      <text fill="white" font-size="12" font-weight="bold">
        <textPath href="#circlePath" startOffset="0">
          🌍 Explorez l'infini 🚀 Découvrez ModelisGroup 🌍  Etude & Conseil en Géomatique
        </textPath>
      </text>
    </svg>
  </div>
  <div class="absolute inset-0 flex mt-24 flex-col items-center justify-center space-y-4 bg-black bg-opacity-30">
    <h1 class="text-6xl md:text-7xl tracking-wide font-extrabold bg-gradient-to-br from-gray-600 via-gray-400 to-zinc-400 bg-clip-text text-transparent text-center">
      Ouvrez les portes
    </h1>
    <h1 class="text-5xl md:text-7xl tracking-wide font-extrabold bg-gradient-to-tl from-slate-800 via-violet-500 to-zinc-400 bg-clip-text text-transparent text-center">
      de la Géomatique
    </h1>
    <p class="text-sm text-white text-center mt-2">
      Collecter, Traiter, Diffuser, Construire
    </p>

    <!-- Bouton "Découvrir" -->
    <a (click)="scrollToAbout($event)" href="#about" class="mt-6">
      <button class="px-8 py-3 mt-20 bg-white bg-opacity-10 backdrop-blur-sm rounded-full text-white font-semibold shadow-lg border border-white border-opacity-30 hover:bg-opacity-40 transition duration-300 ease-in-out animate-bounce">
        Découvrir
      </button>
    </a>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const video = document.querySelector("video");
  if (video) {
    video.muted = true;
    video.playsInline = true;
    video
      .play()
      .then(() => {
        console.log("La vidéo a démarré automatiquement !");
      })
      .catch((error) => {
        console.error("La vidéo n'a pas pu démarrer :", error);
      });
  }
});
</script>
