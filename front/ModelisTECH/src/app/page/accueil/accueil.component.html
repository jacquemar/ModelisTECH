<!-- nos realisations -->
<div id="projects-section" class="bg-gradient-to-r from-[#dfe2fe] mx-12 via-[#b1cbfa] to-[#8e98f5] py-16">
  <div class="container mx-auto px-4">
    <h1 class="text-center font-poppins pb-12 mt-20 text-6xl font-black text-gray-800">NOS RÉALISATIONS</h1>

    <!-- Cards Container -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-20 gap-8 mb-12">
      <div 
        class="bg-white rounded-xl overflow-hidden shadow-lg transform transition-all duration-300 hover:scale-105 hover:shadow-2xl cursor-pointer" 
        *ngFor="let realisation of realisations.slice(0, 6)"
        [routerLink]="['/projets', realisation.id]"
      >
        <div class="relative h-48 overflow-hidden group">
          <img 
            [src]="imgBack + realisation.images[0].image"
            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
            [alt]="realisation.libelle"
            *ngIf="realisation.images && realisation.images.length > 0"
          >
          <!-- Image de fallback si pas d'image -->
          <div class="w-full h-full bg-gray-200 flex items-center justify-center" *ngIf="!realisation.images || realisation.images.length === 0">
            <span class="text-gray-400">Image non disponible</span>
          </div>
          <!-- Overlay au hover -->
          <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
            <span class="text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-semibold">
              Voir le projet
            </span>
          </div>
        </div>
        <div class="p-4">
          <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ realisation.libelle }}</h3>
          <p class="text-gray-600">{{ realisation.paysId.nom || 'Projet' }}</p>
        </div>
      </div>
    </div>

    <!-- Bouton Voir tous les projets -->
    <div class="text-center">
      <a routerLink="/projets" 
         class="inline-block px-8 py-3 text-white bg-base1 hover:bg-black rounded-lg transition-colors duration-300 font-semibold">
        Voir tous nos projets
      </a>
    </div>
  </div>
</div>

<!-- footer-->

</ng-template>
